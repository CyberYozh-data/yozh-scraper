# Hardening (audit H-06): our four services forbid privilege escalation, drop
# every capability and cap their process count. Chrome runs `--no-sandbox`
# under uid 0 and needs no capability for that. With CAP_DAC_OVERRIDE gone,
# root inside a container obeys file modes: a bind-mounted `data/presets`
# must be writable by uid 0 (a directory Docker creates is; one owned by the
# host user needs `chmod o+rwx`). Redis is left alone: its entrypoint chowns
# /data and drops to the `redis` user itself, which needs CHOWN/SETUID/SETGID.
# Turning Chrome's sandbox on takes more than a non-root user: the SUID helper
# is blocked by no-new-privileges and the namespace sandbox by Docker's default
# seccomp profile (no unprivileged user namespaces), so that step also brings a
# seccomp profile or daemon-level userns-remap, and drops `--no-sandbox`.
# Per-host override files must not repeat `security_opt`: Compose appends the
# lists across files and then rejects the duplicate. `cap_add: [SYS_PTRACE]`
# in an override brings py-spy/strace back for a debugging session.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  web-scraper:
    build: .
    restart: unless-stopped
    # Memory cap so a single service can't exhaust the host (or, when several
    # stacks share one box, starve its neighbours). The API only enqueues jobs
    # and reads Redis, so it's light. Override per host if needed.
    mem_limit: 1g
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    # Persist user-defined / self-healed presets across restarts. Built-in
    # presets ship read-only inside the image (src/presets/builtin).
    volumes:
      - ./data/presets:/app/data/presets
    # No shm_size / browsers here anymore — the API only enqueues jobs and
    # reads Redis. Browsers live in the scraper-worker containers below.
    <<: *hardened
    pids_limit: 512
    depends_on:
      redis:
        condition: service_healthy

  # Browser workers: consume the taskiq stream and run Playwright. Scale out
  # with `docker compose up -d --scale scraper-worker=N`.
  # Do not raise --max-async-tasks: _browser_guard (src/queue/tasks.py) relies
  # on one task per process; scale with WORKERS / --scale instead.
  scraper-worker:
    build: .
    restart: unless-stopped
    # Browser-heavy (Playwright/Camoufox per request). Cap memory so a leak or
    # a burst of heavy pages gets OOM-killed inside this container instead of
    # eating the whole host / co-located stacks. Note the shm_size below is a
    # fixed ~1g tax that counts against this cap and does NOT scale with
    # WORKERS, so the real budget is (mem_limit - 1g) / WORKERS (~1.5g/worker
    # here). Default sized for WORKERS=2; bump per host when raising WORKERS.
    mem_limit: 4g
    command: ["sh", "-c", "taskiq worker src.queue.worker:broker --workers ${WORKERS:-2} --max-async-tasks 1"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    shm_size: "1gb"
    stop_grace_period: 120s
    # Same store as web-scraper: self-heal persists from the worker
    # (src/presets/worker_parse.py). Stopgap for audit M-10 -- the target shape
    # returns the healed plan in the job result and persists from the API,
    # which needs no store on the worker at all.
    volumes:
      - ./data/presets:/app/data/presets
    <<: *hardened
    # pids_limit counts threads. Measured on real Chrome 152 headful: base ~35,
    # a warm Chrome ~110-150, a Camoufox ~205-245; a worker process can hold
    # both at once (warm Chromium plus a Camoufox launch), ~315 each. Sized
    # for WORKERS<=4 (~1300 busy); bump per host when raising WORKERS. When
    # the limit binds, clone() fails with EAGAIN and the browser reports a
    # crash -- check /sys/fs/cgroup/pids.events inside the container.
    pids_limit: 2048
    depends_on:
      redis:
        condition: service_healthy

  # Periodic-task scheduler (currently the stale-pending reclaim, every 60s).
  # Run exactly ONE instance — multiple schedulers enqueue each periodic task
  # once per instance. Only enqueues; workers execute the tasks.
  scheduler:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    command: ["taskiq", "scheduler", "src.queue.scheduler:scheduler", "src.queue.tasks"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    <<: *hardened
    pids_limit: 128
    depends_on:
      redis:
        condition: service_healthy

  open-crawler:
    build: yozh-crawler
    restart: unless-stopped
    # lxml + httpx, no browser — light. Cap anyway as host-safety insurance.
    mem_limit: 1g
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - SCRAPER_URL=http://web-scraper:8000
      - HOST=0.0.0.0
      - PORT=8001
      # Must match the scraper's SERVICE_TOKEN (web-scraper reads it via env_file).
      # The crawler configures itself from this block, not a mounted .env, so the
      # token has to be interpolated in explicitly or /map proxy resolution 401s
      # and silently degrades to direct. Sourced from the same host .env.
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
    <<: *hardened
    pids_limit: 256
    depends_on:
      - web-scraper

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 768m
    # maxmemory sits below the cgroup cap so redis enforces noeviction itself
    # (reject writes, keep data) instead of being OOM-killed by the kernel.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "640mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis-data:
